name: OMP Spec-Driven TDD E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "skills/spec-driven-tdd/**"
      - ".github/omp-e2e-config.yml"
      - ".github/omp-e2e-prompt.md"
      - ".github/scripts/**"
      - ".github/workflows/omp-sddtdd-e2e.yml"

permissions:
  contents: read

concurrency:
  group: omp-sddtdd-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arkanoid-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate E2E scripts
        run: |
          echo "[workflow] START validate E2E scripts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash -n .github/scripts/*.sh
          python3 -m py_compile .github/scripts/*.py
          python3 .github/scripts/test_render_omp_events.py
          echo "[workflow] DONE validate E2E scripts $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Set up Oh My Pi
        run: |
          echo "[workflow] START setup OMP $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash .github/scripts/setup_omp_e2e.sh
          echo "[workflow] DONE setup OMP $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Test evidence verifier negative cases
        run: |
          echo "[workflow] START evidence verifier tests $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 skills/spec-driven-tdd/tests/test_verify_evidence.py -v
          echo "[workflow] DONE evidence verifier tests $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Prepare isolated test repository
        run: |
          echo "[workflow] START prepare isolated repository $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash .github/scripts/prepare_omp_e2e.sh
          echo "[workflow] DONE prepare isolated repository $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Run OMP Spec-Driven TDD workflow with live events
        run: |
          echo "[workflow] START OMP live execution $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash .github/scripts/run_omp_e2e.sh
          echo "[workflow] DONE OMP live execution $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify runnable Arkanoid application
        run: |
          echo "[workflow] START Arkanoid runtime verification $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash .github/scripts/verify_arkanoid_e2e.sh
          echo "[workflow] DONE Arkanoid runtime verification $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify committed SDDTDD evidence
        run: |
          echo "[workflow] START SDDTDD evidence verification $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash .github/scripts/verify_sddtdd_evidence.sh
          echo "[workflow] DONE SDDTDD evidence verification $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload OMP E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omp-sddtdd-arkanoid-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ env.OMP_E2E_WORKDIR }}
            ${{ runner.temp }}/omp-events.jsonl
            ${{ runner.temp }}/omp-live.log
            ${{ runner.temp }}/omp-stderr.log
            ${{ runner.temp }}/arkanoid-server.log
            ${{ runner.temp }}/arkanoid-index.html

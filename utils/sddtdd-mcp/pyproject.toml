[project]
name = "sddtdd-mcp"
version = "1.0.0"
description = "Minimal MCP review proxy for Hermes Agent"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6.0",
]

[project.scripts]
sddtdd-mcp = "server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
